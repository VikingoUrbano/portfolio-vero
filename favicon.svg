<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="VR">
  <!-- El rect de fondo no es decorativo: sin el, el icono se ve como un
       cuadrado transparente en las pestanas claras, que es donde se nota. -->
  <rect width="64" height="64" rx="8" fill="#FBF9F6"/>
  <text x="32" y="43"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="30"
        font-weight="600"
        text-anchor="middle"
        fill="#0F766E">VR</text>
</svg>
